# ── SITEMAP: correct MIME type so Google can fetch it ──
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Robots-Tag = "noindex"

# ── ROBOTS.TXT ──
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# ── SECURITY HEADERS for all pages ──
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.customerbase.com; style-src 'self' 'unsafe-inline' https://app.customerbase.com; img-src 'self' data: https://lh3.googleusercontent.com https://drive.google.com https://app.customerbase.com; font-src 'self'; connect-src 'self' https://app.customerbase.com; frame-src https://app.customerbase.com; frame-ancestors 'none';"
